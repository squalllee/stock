<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Taiwan Stock Data{% endblock %}</title>
  <meta name="description" content="台股歷史行情、融資融券與 TDCC 股權分散資料查詢平台">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="/">
        <span class="brand-mark">TS</span>
        <span>Taiwan Stock Data</span>
      </a>
      <nav class="site-nav" aria-label="主要導覽">
        <a href="/stocks">股票查詢</a>
        <a href="/about">資料說明</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Read-only market data explorer</span>
      <a href="/about">資料來源與限制</a>
    </div>
  </footer>
</body>
</html>
